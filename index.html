<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#f5f0e6">

    <meta name="description"
          content="Comparte las fotografías y videos de la boda de Karla y Ricardo.">

    <title>Karla &amp; Ricardo | Recuerdos</title>

    <!-- TIPOGRAFÍAS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- ICONOS -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main>

        <!-- SECCIÓN 1: PORTADA -->

        <section class="hero">

            <picture class="hero-picture">

                <source
                    media="(max-width: 600px)"
                    srcset="img/portada-mobill.png">

                <img
                    src="img/portada-pcc.png"
                    class="hero-img"
                    alt="Karla y Ricardo">

            </picture>

            <div class="overlay"></div>

            <div class="hero-content">

                <h1>
                    Karla &amp; Ricardo
                </h1>

                <p class="fecha">
                    05 · DICIEMBRE · 2026
                </p>

            </div>

        </section>


        <!-- SECCIÓN 2: MENSAJE -->

        <section class="mensaje">

            <div class="container">

                <p class="mensaje-texto">
                    Comparte con nosotros las fotografías y los videos
                    que capturaron durante este día tan especial.
                </p>

            </div>

        </section>


        <!-- SECCIÓN 3: SELECCIONAR FOTOGRAFÍAS Y VIDEOS -->

        <section class="recuerdos">

            <div class="container">

                <div class="cuadro-subida">

                    <div class="icono-fotografia"
                         aria-hidden="true">

                        <i class="fa-regular fa-images"></i>

                    </div>

                    <button
                        type="button"
                        id="seleccionar-archivos"
                        class="btn-recuerdos">

                        <i class="fa-solid fa-cloud-arrow-up"
                           aria-hidden="true"></i>

                        <span>
                            COMPARTIR MIS RECUERDOS
                        </span>

                    </button>

                    <input
                        type="file"
                        id="archivos"
                        accept="image/*,video/*"
                        multiple
                        hidden>

                    <p class="nota-archivos">
                        Puedes seleccionar varias fotografías y videos.
                    </p>

                    <p
                        id="estado-archivos"
                        class="estado-archivos"
                        aria-live="polite">
                    </p>

                </div>

            </div>

        </section>


        <!-- SECCIÓN 4: AGRADECIMIENTO -->

        <footer class="agradecimiento">

            <div class="container">

                <p class="agradecimiento-texto">
                    Gracias por ser parte de nuestra historia de amor.
                </p>

            </div>

        </footer>

    </main>

    <!-- JAVASCRIPT -->

    <script src="js/script.js"></script>

</body>

</html>
