<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Recuerdos de nuestra boda</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f7f3ef;
            color: #493c35;
        }

        main {
            width: 100%;
            max-width: 560px;
            margin: 50px auto;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 26px;
        }

        p {
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5c9c1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #71594a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #mensaje {
            margin-top: 18px;
            overflow-wrap: anywhere;
        }

        .nota {
            margin-top: 24px;
            font-size: 13px;
            color: #75675e;
        }

        #panel {
            display: none;
        }
    </style>
</head>

<body>
    <main>
        <h1>Recuerdos de nuestra boda</h1>
        <p>Acceso privado para administrar las fotografías y los videos.</p>

        <form id="formulario">
            <label for="correo">Correo electrónico</label>
            <input
                id="correo"
                type="email"
                autocomplete="username"
                required
            >

            <label for="contrasena">Contraseña</label>
            <input
                id="contrasena"
                type="password"
                autocomplete="current-password"
                required
            >

            <button id="entrar" type="submit">Iniciar sesión</button>
        </form>

        <p id="mensaje" role="status" aria-live="polite"></p>

        <section id="panel">
            <h2>Sesión iniciada</h2>
            <p id="usuario"></p>
            <p>El acceso está autenticado. La galería privada se configurará en el siguiente paso.</p>
            <button id="salir" type="button">Cerrar sesión</button>
        </section>

        <p class="nota">
            Esta página es independiente de la página pública de recuerdos.
        </p>
    </main>

    <script type="module">
        import { createClient } from
            "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL =
            "https://jwkorzxsckcrpsdrvsfv.supabase.co";

        // La clave publishable es pública; nunca pongas aquí una service_role.
        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_t-MzMqmI7B_QUXmWrzDU-w_d_clAFeP";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const formulario = document.getElementById("formulario");
        const correo = document.getElementById("correo");
        const contrasena = document.getElementById("contrasena");
        const boton = document.getElementById("entrar");
        const mensaje = document.getElementById("mensaje");
        const panel = document.getElementById("panel");
        const usuario = document.getElementById("usuario");

        function mostrarSesion(email) {
            formulario.style.display = "none";
            panel.style.display = "block";
            usuario.textContent = "Sesión iniciada como: " + email;
        }

        async function comprobarSesion() {
            const { data, error } = await supabase.auth.getUser();

            if (!error && data.user) {
                mostrarSesion(data.user.email);
            }
        }

        formulario.addEventListener("submit", async function (evento) {
            evento.preventDefault();

            if (SUPABASE_PUBLISHABLE_KEY.includes("PEGA_AQUI")) {
                mensaje.textContent =
                    "Falta configurar la clave publishable de Supabase.";
                return;
            }

            boton.disabled = true;
            mensaje.textContent = "Verificando acceso...";

            try {
                const { data, error } =
                    await supabase.auth.signInWithPassword({
                        email: correo.value.trim(),
                        password: contrasena.value
                    });

                if (error) throw error;

                mensaje.textContent = "";
                mostrarSesion(data.user.email);
                contrasena.value = "";
            } catch (error) {
                mensaje.textContent =
                    "No se pudo iniciar sesión. Comprueba el correo y la contraseña.";
                console.error("Error de inicio de sesión:", error);
            } finally {
                boton.disabled = false;
            }
        });

        document.getElementById("salir").addEventListener(
            "click",
            async function () {
                await supabase.auth.signOut();
                panel.style.display = "none";
                formulario.style.display = "block";
                contrasena.value = "";
                mensaje.textContent = "Sesión cerrada.";
            }
        );

        comprobarSesion();
    </script>
</body>
</html>
